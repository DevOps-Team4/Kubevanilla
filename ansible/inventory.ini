# Bastion
[bastion-host]
bastion ansible_host=34.107.25.116

# Alias for bastion group (used by some playbooks)
[bastion:children]
bastion-host

# Kubernetes Master
[k8s-masters]
k8s-master-1 ansible_host=10.1.1.3 ansible_ssh_common_args='-o ProxyJump=bastion -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardAgent=yes'

# Kubernetes Workers  
[k8s-workers]
k8s-worker-1 ansible_host=10.1.2.3 ansible_ssh_common_args='-o ProxyJump=bastion -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardAgent=yes'
k8s-worker-2 ansible_host=10.1.2.4 ansible_ssh_common_args='-o ProxyJump=bastion -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardAgent=yes'

# Database
[postgres-db]
database ansible_host=10.1.2.2 ansible_ssh_common_args='-o ProxyJump=bastion -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardAgent=yes'

# Kubernetes cluster group
[k8s-cluster:children]
k8s-masters
k8s-workers

# Global variables
[all:vars]
ansible_user=provisioning
ansible_ssh_private_key_file=../terraform/.ssh/provisioning_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
postgres_user=postgres
postgres_password=SecureStagePass2024!
postgres_db=appdb