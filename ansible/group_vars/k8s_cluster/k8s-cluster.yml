---
# Kubespray Cluster Configuration
# This file contains the main configuration for your Kubernetes cluster

# Kubernetes version (without 'v' prefix)
# Note: Current Kubespray requires minimum Kubernetes 1.32.0
kube_version: 1.32.0

# Container runtime (containerd is recommended)
container_manager: containerd

# Network plugin (Calico is popular and well-tested)
kube_network_plugin: calico

# Service and Pod CIDR
kube_service_addresses: 10.233.0.0/18
kube_pods_subnet: 10.233.64.0/18

# DNS configuration
dns_mode: coredns
enable_nodelocaldns: true

# Enable Kubernetes dashboard
dashboard_enabled: true

# Enable metrics server
metrics_server_enabled: true

# Helm deployment
helm_enabled: true

# Enable cert-manager for TLS certificate management
cert_manager_enabled: false

# Ingress controller
ingress_nginx_enabled: true
ingress_nginx_host_network: true

# Kubelet configuration
kubelet_max_pods: 110
kubelet_authentication_token_webhook: true

# API server configuration
kube_apiserver_enable_admission_plugins:
  - NodeRestriction
  - PodSecurityPolicy
  - ServiceAccount

# Enable audit logging
kubernetes_audit: true

# Container image repo
kube_image_repo: "registry.k8s.io"

# Download locations (kubespray will handle these automatically)
# kubelet_download_url: "https://storage.googleapis.com/kubernetes-release/release/v{{ kube_version }}/bin/linux/{{ image_arch }}/kubelet"
# kubectl_download_url: "https://storage.googleapis.com/kubernetes-release/release/v{{ kube_version }}/bin/linux/{{ image_arch }}/kubectl"

# Cluster name
cluster_name: sytoss-k8s-cluster

# Cloud provider
# Note: Kubernetes 1.31+ no longer supports built-in cloud providers (gce, aws, etc.)
# For self-managed clusters, leave cloud_provider unset or use 'external'
# cloud_provider: external  # Only if using external cloud controller
# external_cloud_provider: gce  # Required if cloud_provider is 'external'

# Enable persistent volumes
persistent_volumes_enabled: true

# Configure automatic certificate rotation
kubelet_rotate_certificates: true
kubelet_rotate_server_certificates: true

# Memory requirements (override Kubespray defaults if needed)
# Default: minimal_master_memory_mb: 1500 (1.5 GB), minimal_node_memory_mb: 1024 (1 GB)
# NOTE: Temporarily reduced to 900 MB to allow deployment with current VM (958 MB available)
# After applying Terraform changes (e2-standard-4 has 16 GB), change this back to 1500/1024
minimal_master_memory_mb: 900  # Temporarily reduced from 1500 to 900 MB for current VM
minimal_node_memory_mb: 900    # Temporarily reduced from 1024 to 900 MB for current VM
# WARNING: This is NOT recommended for production! Increase VM memory via Terraform instead.
