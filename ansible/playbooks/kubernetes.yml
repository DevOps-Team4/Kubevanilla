---
# Kubernetes Cluster Deployment Playbook using Kubespray
# This playbook orchestrates the deployment of a self-managed Kubernetes cluster
# on your GCP infrastructure

- name: Deploy Kubernetes Cluster with Kubespray
  hosts: localhost
  gather_facts: false
  vars:
    kubespray_dir: "{{ playbook_dir }}/../kubespray"
    k8s_inventory: "{{ playbook_dir }}/../k8s-inventory.ini"
  
  tasks:
    - name: Display deployment information
      debug:
        msg:
          - "=========================================="
          - "Kubernetes Cluster Deployment"
          - "=========================================="
          - "Kubespray Directory: {{ kubespray_dir }}"
          - "Inventory File: {{ k8s_inventory }}"
          - "Cluster Name: sytoss-k8s-cluster"
          - "Control Plane: k8s-master (10.1.1.3)"
          - "Workers: k8s-worker-1 (10.1.2.3), k8s-worker-2 (10.1.2.2)"
          - "=========================================="

    - name: Check if Kubespray directory exists
      stat:
        path: "{{ kubespray_dir }}"
      register: kubespray_stat

    - name: Fail if Kubespray not found
      fail:
        msg: "Kubespray directory not found at {{ kubespray_dir }}. Please clone it first."
      when: not kubespray_stat.stat.exists

    - name: Check if inventory file exists
      stat:
        path: "{{ k8s_inventory }}"
      register: inventory_stat

    - name: Fail if inventory not found
      fail:
        msg: "Kubernetes inventory not found at {{ k8s_inventory }}"
      when: not inventory_stat.stat.exists

    - name: Display pre-deployment checklist
      debug:
        msg:
          - "Pre-deployment Checklist:"
          - "1. ✓ Kubespray repository cloned"
          - "2. ✓ Kubernetes inventory configured"
          - "3. ✓ Group variables set"
          - "4. Ensure all nodes are accessible via SSH"
          - "5. Ensure Python3 is installed on all nodes"
          - "6. Ready to deploy!"

- name: Prepare all nodes for Kubernetes
  hosts: k8s_cluster
  gather_facts: true
  become: true
  
  tasks:
    - name: Check and resolve apt-get lock issues
      shell: |
        # Check if apt-get is running
        if pgrep -f "apt-get|apt|dpkg" > /dev/null; then
          echo "Waiting for apt processes to finish..."
          timeout 60 bash -c 'while pgrep -f "apt-get|apt|dpkg" > /dev/null; do sleep 2; done' || true
        fi
        
        # Fix interrupted dpkg configuration
        if dpkg -l | grep -q "^..r"; then
          echo "Fixing interrupted dpkg configuration..."
          sudo dpkg --configure -a || true
        fi
        
        # Remove stale locks if they exist and no process is using them
        if [ -f /var/lib/dpkg/lock-frontend ] && ! lsof /var/lib/dpkg/lock-frontend > /dev/null 2>&1; then
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
          echo "Removed stale lock files"
        fi
        
        # Stop unattended-upgrades if running to prevent conflicts
        sudo systemctl stop unattended-upgrades 2>/dev/null || true
      when: ansible_os_family == "Debian"
      changed_when: false
      failed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install Python3 and pip
      apt:
        name:
          - python3
          - python3-pip
          - python3-setuptools
        state: present
      when: ansible_os_family == "Debian"

    - name: Disable swap
      shell: swapoff -a
      changed_when: false

    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '^[^#].*\sswap\s'
        state: absent

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Set sysctl parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }

    - name: Check memory requirements for control plane
      assert:
        that:
          - ansible_memtotal_mb >= (minimal_master_memory_mb | default(1500))
        fail_msg: "Control plane node {{ inventory_hostname }} has insufficient memory. Minimum required: {{ minimal_master_memory_mb | default(1500) }} MB, current: {{ ansible_memtotal_mb }} MB. Please increase VM memory in GCP or set minimal_master_memory_mb in group_vars."
        success_msg: "Control plane node {{ inventory_hostname }} has sufficient memory: {{ ansible_memtotal_mb }} MB (required: {{ minimal_master_memory_mb | default(1500) }} MB)"
      when:
        - ('kube_control_plane' in group_names)
        - ansible_memtotal_mb is defined

    - name: Display node preparation status
      debug:
        msg: "Node {{ inventory_hostname }} prepared for Kubernetes installation (Memory: {{ ansible_memtotal_mb | default('N/A') }} MB)"

- name: Execute Kubespray Cluster Deployment
  hosts: localhost
  gather_facts: false
  vars:
    kubespray_dir: "{{ playbook_dir }}/../kubespray"
    k8s_inventory: "{{ playbook_dir }}/../k8s-inventory.ini"
  
  tasks:
    - name: Check if Ansible is updated on bastion (required for Kubespray)
      command: ansible bastion -i {{ k8s_inventory }} -m command -a "ansible --version" -o
      register: bastion_ansible_check
      changed_when: false
      failed_when: false

    - name: Display bastion Ansible version
      debug:
        msg: "Bastion Ansible version check: {{ bastion_ansible_check.stdout | default('Could not check') }}"

    - name: Warn if bastion Ansible version is too old
      fail:
        msg: |
          Bastion has Ansible version < 2.17.3. Please update it first:
          
          Run: ansible-playbook -i {{ k8s_inventory }} playbooks/bastion.yml
          
          This will update Ansible on bastion to the required version (2.17.3+).
      when: 
        - bastion_ansible_check.rc != 0 or
          (bastion_ansible_check.rc == 0 and 
           ('2.17' not in (bastion_ansible_check.stdout | default('')) and 
            '2.18' not in (bastion_ansible_check.stdout | default('')) and
            '2.19' not in (bastion_ansible_check.stdout | default('')) and
            '2.20' not in (bastion_ansible_check.stdout | default(''))))
    - name: Display Kubespray execution information
      debug:
        msg:
          - "=========================================="
          - "Starting Kubespray Deployment"
          - "=========================================="
          - "This will take 15-30 minutes depending on network speed"
          - "The deployment will:"
          - "  - Install container runtime (containerd)"
          - "  - Set up Kubernetes control plane"
          - "  - Join worker nodes to the cluster"
          - "  - Install network plugin (Calico)"
          - "  - Deploy cluster addons"
          - "=========================================="

    - name: Run Kubespray cluster.yml playbook
      shell: |
        cd {{ kubespray_dir }}
        export ANSIBLE_ROLES_PATH={{ kubespray_dir }}/roles:$ANSIBLE_ROLES_PATH
        export ANSIBLE_LIBRARY={{ kubespray_dir }}/library:$ANSIBLE_LIBRARY
        ansible-playbook -i {{ k8s_inventory }} \
          --become \
          --become-user=root \
          playbooks/cluster.yml
      register: kubespray_output
      changed_when: true

    - name: Display deployment output
      debug:
        var: kubespray_output.stdout_lines

- name: Post-Deployment Configuration
  hosts: kube_control_plane
  gather_facts: false
  become: true
  
  tasks:
    - name: Create .kube directory for provisioning user
      file:
        path: /home/provisioning/.kube
        state: directory
        owner: provisioning
        group: provisioning
        mode: '0755'

    - name: Copy admin kubeconfig to provisioning user
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/provisioning/.kube/config
        remote_src: yes
        owner: provisioning
        group: provisioning
        mode: '0600'

    - name: Get cluster info
      become_user: provisioning
      shell: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Display cluster information
      debug:
        msg: "{{ cluster_info.stdout_lines }}"

    - name: Get nodes status
      become_user: provisioning
      shell: kubectl get nodes -o wide
      register: nodes_status
      changed_when: false

    - name: Display nodes status
      debug:
        msg: "{{ nodes_status.stdout_lines }}"

    - name: Fetch kubeconfig to local machine
      fetch:
        src: /home/provisioning/.kube/config
        dest: "{{ playbook_dir }}/../kubeconfig"
        flat: yes

- name: Display deployment summary
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Show final deployment summary
      debug:
        msg:
          - "=========================================="
          - "Kubernetes Cluster Deployment Complete!"
          - "=========================================="
          - ""
          - "Cluster Configuration:"
          - "  - Cluster Name: sytoss-k8s-cluster"
          - "  - Kubernetes Version: v1.28.5"
          - "  - Network Plugin: Calico"
          - "  - Control Plane: k8s-master (10.1.1.3)"
          - "  - Workers: 2 nodes"
          - ""
          - "Next Steps:"
          - "1. Configure kubectl on your local machine:"
          - "   export KUBECONFIG={{ playbook_dir }}/../kubeconfig"
          - ""
          - "2. Access cluster via bastion:"
          - "   ssh -i ~/.ssh/provisioning_key provisioning@34.159.39.161"
          - ""
          - "3. Verify cluster:"
          - "   kubectl get nodes"
          - "   kubectl get pods --all-namespaces"
          - ""
          - "4. Access Kubernetes Dashboard:"
          - "   kubectl proxy"
          - "   Then visit: http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy/"
          - ""
          - "=========================================="
