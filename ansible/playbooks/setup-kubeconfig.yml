---
# Setup Kubeconfig on Bastion
# This playbook finds and copies the kubeconfig from the master node to the bastion host

- name: Find and Read Admin Kubeconfig from Master
  hosts: k8s-master-1
  gather_facts: true
  become: true
  
  tasks:
    - name: Get master node internal IP address
      set_fact:
        master_internal_ip: "{{ ansible_default_ipv4.address | default(ansible_host) }}"

    - name: Get master node external IP (if available)
      set_fact:
        master_external_ip: "{{ ansible_host if ansible_host != ansible_default_ipv4.address else '' }}"

    - name: Check which IP is accessible from bastion
      set_fact:
        master_node_ip: "{{ master_internal_ip }}"
      # Use internal IP by default as it's more likely to work within VPC

    - name: Display master IPs
      debug:
        msg:
          - "Master internal IP: {{ master_internal_ip }}"
          - "Master external IP: {{ master_external_ip | default('N/A') }}"
          - "Will use IP: {{ master_node_ip }}"

    - name: Find admin.conf file location
      shell: |
        if [ -f /etc/kubernetes/admin.conf ]; then
          echo "/etc/kubernetes/admin.conf"
        elif [ -f /root/.kube/config ]; then
          echo "/root/.kube/config"
        elif [ -f /home/provisioning/.kube/config ]; then
          echo "/home/provisioning/.kube/config"
        else
          find /etc/kubernetes -name "admin.conf" 2>/dev/null | head -1 || echo ""
        fi
      register: admin_conf_path
      changed_when: false

    - name: Display admin.conf location
      debug:
        msg: "Searching for admin.conf file..."

    - name: Check if admin.conf was found
      assert:
        that:
          - admin_conf_path.stdout != ""
        fail_msg: "Could not find admin.conf file. Kubernetes cluster may not be fully deployed."
        success_msg: "Found admin.conf at: {{ admin_conf_path.stdout }}"

    - name: Read admin.conf content
      slurp:
        src: "{{ admin_conf_path.stdout }}"
      register: admin_conf_content

    - name: Display success message
      debug:
        msg: "Successfully read admin.conf from {{ admin_conf_path.stdout }}"

    - name: Check if API server is running
      shell: |
        if systemctl is-active --quiet kubelet; then
          echo "running"
        else
          echo "stopped"
        fi
      register: kubelet_status
      changed_when: false
      failed_when: false

    - name: Check if API server port is listening
      shell: |
        if netstat -tlnp 2>/dev/null | grep -q ':6443 ' || ss -tlnp 2>/dev/null | grep -q ':6443 '; then
          echo "listening"
        else
          echo "not_listening"
        fi
      register: api_server_listening
      changed_when: false
      failed_when: false

    - name: Display API server status
      debug:
        msg:
          - "Kubelet status: {{ kubelet_status.stdout }}"
          - "API server port 6443: {{ api_server_listening.stdout }}"
          - "If not listening, API server may not be ready yet"

- name: Copy Kubeconfig to Bastion
  hosts: bastion
  gather_facts: false
  become: false
  
  vars:
    admin_conf_content: "{{ hostvars['k8s-master-1']['admin_conf_content']['content'] | b64decode }}"
    master_ip: "{{ hostvars['k8s-master-1']['master_node_ip'] | default(hostvars['k8s-master-1']['ansible_host'] | default('10.1.1.2')) }}"
  
  tasks:
    - name: Get home directory
      shell: echo $HOME
      register: home_dir
      changed_when: false

    - name: Create .kube directory
      file:
        path: "{{ home_dir.stdout }}/.kube"
        state: directory
        mode: '0755'

    - name: Write kubeconfig to bastion (temporary)
      copy:
        content: "{{ admin_conf_content }}"
        dest: "{{ home_dir.stdout }}/.kube/config.tmp"
        mode: '0600'

    - name: Show original server URL in config
      shell: grep -A 2 -B 2 "server:" {{ home_dir.stdout }}/.kube/config.tmp || echo "No server line found"
      register: original_server
      changed_when: false
      failed_when: false

    - name: Display original server URL context
      debug:
        msg: "Original server URL context:\n{{ original_server.stdout }}"

    - name: Display master IP to use
      debug:
        msg: "Master IP to use: {{ master_ip }}"

    - name: Update server URL in kubeconfig (any localhost variant or IP)
      replace:
        path: "{{ home_dir.stdout }}/.kube/config.tmp"
        regexp: 'https://(127\.0\.0\.1|localhost|0\.0\.0\.0|[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+):6443'
        replace: 'https://{{ master_ip }}:6443'
      register: server_replaced

    - name: Display server replacement status
      debug:
        msg: "Server replacement changed: {{ server_replaced.changed }}"

    - name: Show updated server URL in config
      shell: grep "server:" {{ home_dir.stdout }}/.kube/config.tmp || echo "No server line found"
      register: updated_server
      changed_when: false
      failed_when: false

    - name: Display updated server URL
      debug:
        msg: "Updated server URL: {{ updated_server.stdout }}"

    - name: Move temporary config to final location
      shell: mv {{ home_dir.stdout }}/.kube/config.tmp {{ home_dir.stdout }}/.kube/config
      args:
        removes: "{{ home_dir.stdout }}/.kube/config.tmp"

    - name: Verify kubeconfig was written
      stat:
        path: "{{ home_dir.stdout }}/.kube/config"
      register: kubeconfig_stat

    - name: Display kubeconfig status
      debug:
        msg: "Kubeconfig written to: {{ kubeconfig_stat.stat.path }}"

- name: Test kubectl Access
  hosts: bastion
  gather_facts: false
  become: false
  
  vars:
    master_ip: "{{ hostvars['k8s-master-1']['master_node_ip'] | default(hostvars['k8s-master-1']['master_internal_ip'] | default('10.1.1.2')) }}"
  
  tasks:
    - name: Get home directory for path resolution
      shell: echo $HOME
      register: home_dir_check
      changed_when: false

    - name: Check if API server actually responds (HTTP/HTTPS check)
      uri:
        url: "https://{{ master_ip }}:6443/healthz"
        method: GET
        validate_certs: false
        timeout: 5
      register: api_health_check
      failed_when: false
      changed_when: false
      ignore_errors: true

    - name: Determine if API server is truly accessible
      set_fact:
        port_check:
          failed: "{{ api_health_check.status | default(0) != 200 }}"
          accessible: "{{ api_health_check.status | default(0) == 200 }}"

    - name: Display port check result
      debug:
        msg:
          - "API server health check: {{ 'healthy (status 200)' if api_health_check.status == 200 else 'unhealthy/not responding (status: ' + (api_health_check.status | string | default('connection refused')) + ')' }}"
          - "API server on {{ master_ip }}:6443 is {{ 'accessible' if not port_check.failed else 'NOT accessible' }}"
          - "{{ '⚠️  Kubelet is STOPPED - API server cannot be running!' if hostvars['k8s-master-1']['kubelet_status'].stdout == 'stopped' else '' }}"

    - name: Try alternative IP if port check failed
      set_fact:
        master_ip: "{{ hostvars['k8s-master-1']['master_external_ip'] | default(hostvars['k8s-master-1']['ansible_host'] | default('10.1.1.2')) }}"
      when: 
        - port_check.failed | default(true)
        - hostvars['k8s-master-1']['master_external_ip'] is defined
        - hostvars['k8s-master-1']['master_external_ip'] != ""

    - name: Retry port check with alternative IP
      wait_for:
        host: "{{ master_ip }}"
        port: 6443
        timeout: 10
        delay: 2
      register: port_check_retry
      failed_when: false
      changed_when: false
      ignore_errors: true
      when: 
        - port_check.failed | default(true)
        - hostvars['k8s-master-1']['master_external_ip'] is defined
        - hostvars['k8s-master-1']['master_external_ip'] != ""

    - name: Update kubeconfig with alternative IP if retry succeeded
      replace:
        path: "{{ home_dir_check.stdout }}/.kube/config"
        regexp: 'https://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:6443'
        replace: 'https://{{ master_ip }}:6443'
      when: 
        - port_check.failed | default(true)
        - port_check_retry is defined
        - not port_check_retry.failed | default(true)
      register: config_updated

    - name: Warn if API server is not accessible
      debug:
        msg:
          - "⚠️  WARNING: API server on {{ master_ip }}:6443 is not accessible from bastion"
          - ""
          - "API server status on master:"
          - "  - Kubelet: {{ hostvars['k8s-master-1']['kubelet_status'].stdout | default('unknown') }}"
          - "  - Listening: {{ hostvars['k8s-master-1']['api_server_listening'].stdout | default('unknown') }}"
          - ""
          - "🔴 CRITICAL: Kubelet is {{ hostvars['k8s-master-1']['kubelet_status'].stdout | default('unknown') }}"
          - ""
          - "To fix this, you need to start the Kubernetes cluster:"
          - "  1. SSH to master node: ssh k8s-master-1"
          - "  2. Check kubelet status: sudo systemctl status kubelet"
          - "  3. Start kubelet if stopped: sudo systemctl start kubelet"
          - "  4. Enable kubelet: sudo systemctl enable kubelet"
          - "  5. Check if cluster is deployed:"
          - "     - If using Kubespray, run the deployment playbook"
          - "     - Wait for API server to start (may take 5-10 minutes)"
          - ""
          - "Alternative: If cluster is not deployed yet, deploy it first:"
          - "  cd ~/Kubevanilla/ansible"
          - "  ansible-playbook -i k8s-inventory.ini playbooks/kubernetes.yml"
          - ""
          - "The kubeconfig has been configured, but kubectl will not work until API server is running."
      when: port_check.failed | default(true) and (port_check_retry.failed | default(true) or port_check_retry is not defined)

    - name: Test kubectl get nodes
      command: kubectl get nodes
      register: kubectl_output
      changed_when: false
      failed_when: false

    - name: Display kubectl test result
      debug:
        msg: "{{ kubectl_output.stdout_lines }}"
      when: kubectl_output.rc == 0

    - name: Display error if kubectl failed
      debug:
        msg:
          - "kubectl test failed!"
          - "Error: {{ kubectl_output.stderr | default(kubectl_output.stdout) }}"
          - ""
          - "Troubleshooting steps:"
          - "1. Check if API server is running on master:"
          - "   ssh k8s-master-1 'sudo systemctl status kubelet'"
          - "2. Check if port 6443 is open:"
          - "   nc -zv {{ master_ip }} 6443"
          - "3. Check firewall rules on master node"
          - "4. Verify API server is listening:"
          - "   ssh k8s-master-1 'sudo netstat -tlnp | grep 6443'"
          - "5. Try using SSH tunnel:"
          - "   ssh -L 6443:{{ master_ip }}:6443 k8s-master-1 -N &"
          - "   Then update kubeconfig: server: https://localhost:6443"
      when: kubectl_output.rc != 0

    - name: Display success message
      debug:
        msg:
          - "=========================================="
          - "✓ Kubeconfig setup complete!"
          - "=========================================="
          - "Master node IP: {{ master_ip }}"
          - "Kubeconfig location: ~/.kube/config"
          - ""
          - "You can now use kubectl from bastion:"
          - "  ssh bastion"
          - "  kubectl get nodes"
          - "=========================================="
      when: kubectl_output.rc == 0

