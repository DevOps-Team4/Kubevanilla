---
- name: Bastion basic configuration
  hosts: bastion
  become: true

  tasks:
    - name: Check current Ansible version
      command: ansible --version
      register: ansible_version_check
      changed_when: false
      failed_when: false

    - name: Display current Ansible version
      debug:
        msg: "Current Ansible version: {{ ansible_version_check.stdout_lines[0] | default('Unknown') }}"

    - name: Install Python3 and pip if not present
      apt:
        name:
          - python3
          - python3-pip
        state: present
        update_cache: yes

    - name: Install/Upgrade Ansible to required version (2.17.3+ but < 2.18.0)
      pip:
        name: "ansible>=2.17.3,<2.18.0"
        state: present
        executable: pip3
        upgrade: yes
      register: ansible_install

    - name: Verify Ansible version after installation
      command: ansible --version
      register: ansible_version_after
      changed_when: false

    - name: Display installed Ansible version
      debug:
        msg: "Installed Ansible version: {{ ansible_version_after.stdout_lines[0] }}"
    - name: Create team users
      user:
        name: "{{ item }}"
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true
      loop: "{{ team_users }}"

    - name: Add SSH keys for team users
      authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.key }}"
        state: present
      loop: "{{ team_ssh_keys }}"

    - name: Allow team users sudo without password
      copy:
        dest: "/etc/sudoers.d/{{ item }}"
        content: "{{ item }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'
      loop: "{{ team_users }}"

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart SSH

    - name: Ensure SSH TCP forwarding is enabled (required for ProxyJump)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowTcpForwarding'
        line: 'AllowTcpForwarding yes'
      notify: Restart SSH


    - name: Disable root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted
