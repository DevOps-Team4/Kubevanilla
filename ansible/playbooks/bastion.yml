---
- name: Bastion basic configuration
  hosts: bastion
  become: true

  tasks:
    - name: Install Python3 and pip if not present
      apt:
        name:
          - python3
          - python3-pip
          - curl
        state: present
        update_cache: yes

    - name: Download kubectl binary
      get_url:
        url: "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
        dest: /tmp/kubectl
        mode: '0755'

    - name: Install kubectl
      copy:
        src: /tmp/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'
        owner: root
        group: root
        remote_src: yes

    - name: Verify kubectl installation
      command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Display kubectl version
      debug:
        msg: "kubectl version: {{ kubectl_version.stdout_lines[0] }}"

    - name: Enable kubectl autocompletion for bash
      lineinfile:
        path: /etc/bash.bashrc
        line: 'source <(kubectl completion bash)'
        create: yes

    - name: Download Helm binary
      get_url:
        url: https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz
        dest: /tmp/helm.tar.gz
        mode: '0644'

    - name: Extract Helm archive
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Install Helm binary
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: '0755'
        owner: root
        group: root
        remote_src: yes

    - name: Verify Helm installation
      command: helm version
      register: helm_version
      changed_when: false

    - name: Display Helm version
      debug:
        msg: "{{ helm_version.stdout }}"

    - name: Create team users
      user:
        name: "{{ item }}"
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true
      loop: "{{ team_users }}"

    - name: Add SSH keys for team users
      authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.key }}"
        state: present
      loop: "{{ team_ssh_keys }}"

    - name: Allow team users sudo without password
      copy:
        dest: "/etc/sudoers.d/{{ item }}"
        content: "{{ item }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'
      loop: "{{ team_users }}"

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart SSH

    - name: Ensure SSH TCP forwarding is enabled (required for ProxyJump)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowTcpForwarding'
        line: 'AllowTcpForwarding yes'
      notify: Restart SSH


    - name: Disable root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted
