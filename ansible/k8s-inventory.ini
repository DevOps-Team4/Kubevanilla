# Kubernetes Cluster Inventory for Kubespray
# This inventory configures a 3-node Kubernetes cluster

# Bastion host for SSH access
[bastion]
bastion ansible_host=34.159.39.161

# Kubernetes control plane nodes (masters)
# Using the frontend server as the control plane
[kube_control_plane]
k8s-master ansible_host=10.1.1.2

# Kubernetes worker nodes
# Using backend server as worker node
[kube_node]
k8s-worker-1 ansible_host=10.1.2.4
k8s-worker-2 ansible_host=10.1.2.3

# etcd cluster nodes (should be odd number: 1, 3, 5, 7)
# For small clusters, etcd runs on control plane nodes
[etcd]
k8s-master ansible_host=10.1.1.2

# Group for all Kubernetes nodes
[k8s_cluster:children]
kube_control_plane
kube_node

# All private nodes that need bastion proxy
[private_nodes:children]
kube_node

# Global variables for all hosts
[all:vars]
ansible_user=provisioning
ansible_ssh_private_key_file=~/.ssh/provisioning_key
ansible_python_interpreter=/usr/bin/python3

# Bastion configuration
[bastion:vars]
ansible_connection=ssh

# Private nodes access through bastion
[private_nodes:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q -i ~/.ssh/provisioning_key provisioning@34.159.39.161"'

# Control plane can be accessed directly (it's in public subnet)
[kube_control_plane:vars]
# No proxy needed for control plane in public subnet
