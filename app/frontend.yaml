apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-frontend
  template:
    metadata:
      labels:
        app: bookstore-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/martahentosh/bookstore-frontend:f1f3e31 
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-frontend
  namespace: default
spec:
  selector:
    app: bookstore-frontend
  ports:
    - port: 80
      targetPort: 80