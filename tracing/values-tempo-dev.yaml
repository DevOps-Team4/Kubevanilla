apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.7.1
    helm:
      values: |
        tempo:
          repository: grafana/tempo
          tag: latest
          storage:
            trace:
              backend: local
          securityContext:
            runAsUser: 0
            runAsGroup: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true