elasticsearch:
  replicas: 1
  minimumMasterNodes: 1

  protocol: http

  createCert: false

  secret:
    enabled: false

  tls:
    enabled: false

  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

  esConfig:
    elasticsearch.yml: |
      xpack.security.enabled: false
      xpack.security.transport.ssl.enabled: false
      xpack.security.http.ssl.enabled: false
      discovery.type: single-node

  esJavaOpts: "-Xmx512m -Xms512m"

  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "1.5Gi"

  volumeClaimTemplate:
    accessModes: [ "ReadWriteOnce" ]
    resources:
      requests:
        storage: 5Gi

fluent-bit:
  config:
    outputs: |
      [OUTPUT]
          Name            es
          Match           *
          Host            elasticsearch-master
          Port            9200
          Logstash_Format On
          Replace_Dots    On
          Retry_Limit     False
          Suppress_Type_Name On
          tls             Off