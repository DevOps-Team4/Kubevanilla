elasticsearch:
  secret:
    password: "ZTDyL08jIvq1dbJj"
  createCert: true
  replicas: 1
  minimumMasterNodes: 1

  clusterHealthCheckParams: "wait_for_status=yellow&timeout=30s"

  protocol: https

  esJavaOpts: "-Xmx512m -Xms512m"

  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "1.5Gi"

  volumeClaimTemplate:
    accessModes: [ "ReadWriteOnce" ]
    resources:
      requests:
        storage: 5Gi

fluent-bit:
  config:
    outputs: |
      [OUTPUT]
          Name            es
          Match           *
          Host            elasticsearch-master
          Port            9200
          tls             On
          tls.verify      Off

          HTTP_User       elastic
          HTTP_Passwd     ZTDyL08jIvq1dbJj

          Logstash_Format On
          Replace_Dots    On
          Retry_Limit     False
          Suppress_Type_Name On