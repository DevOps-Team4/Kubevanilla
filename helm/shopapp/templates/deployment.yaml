      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopapp.fullname" . }}-postgresql
  labels:
    {{- include "shopapp.labels" . | nindent 4 }}
    component: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "shopapp.selectorLabels" . | nindent 6 }}
      component: postgresql
  template:
    metadata:
      labels:
        {{- include "shopapp.selectorLabels" . | nindent 8 }}
        component: postgresql
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: postgresql
        image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
        imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.env.POSTGRES_USER | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.env.POSTGRES_DB | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "shopapp.fullname" . }}-secret
              key: postgres-password
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgres/data
        resources:
          {{- toYaml .Values.postgresql.resources | nindent 10 }}
      volumes:
      {{- if .Values.postgresql.persistence.enabled }}
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: {{ include "shopapp.fullname" . }}-postgresql-pvc
      {{- else }}
      - name: postgresql-data
        emptyDir: {}
      {{- end }}
---
{{- end }}

