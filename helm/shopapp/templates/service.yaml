{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shopapp.fullname" . }}-backend
  labels:
    {{- include "shopapp.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "shopapp.selectorLabels" . | nindent 4 }}
    component: backend
---
{{- end }}
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shopapp.fullname" . }}-frontend
  labels:
    {{- include "shopapp.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "shopapp.selectorLabels" . | nindent 4 }}
    component: frontend
---
{{- end }}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shopapp.fullname" . }}-postgresql
  labels:
    {{- include "shopapp.labels" . | nindent 4 }}
    component: postgresql
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "shopapp.selectorLabels" . | nindent 4 }}
    component: postgresql
---
{{- end }}

