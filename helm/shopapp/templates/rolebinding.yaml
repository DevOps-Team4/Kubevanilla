{{- if and .Values.rbac.create .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shopapp.fullname" . }}-rolebinding
  labels:
    {{- include "shopapp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shopapp.fullname" . }}-role
subjects:
- kind: ServiceAccount
  name: {{ include "shopapp.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}

