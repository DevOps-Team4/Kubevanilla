{{- if not .Values.postgresql.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shopapp.fullname" . }}-secret
  labels:
    {{- include "shopapp.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ (.Values.postgresql.env.POSTGRES_PASSWORD | default "bookstoreadmin") | b64enc | quote }}
{{- end }}

