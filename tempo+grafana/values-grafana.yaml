apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 8.5.1
    helm:
      values: |-
        replicas: 1

        service:
          type: ClusterIP
          port: 80
          targetPort: 3000

        ingress:
          enabled: true
          ingressClassName: nginx 
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - grafana.35.207.106.1.nip.io
          path: /

        persistence:
          enabled: false

        readinessProbe:
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10

        livenessProbe:
          initialDelaySeconds: 60

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Tempo
                type: tempo
                access: proxy
                url: http://tempo.tracing-dev.svc.cluster.local:3100
                editable: true

        grafana.ini:
          server:
            root_url: http://grafana.35.207.106.1.nip.io
          auth.anonymous:
            enabled: true
            org_role: Admin

  destination:
    server: https://kubernetes.default.svc
    namespace: tracing-dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true