all:
  hosts:
    k8s-master-1:
      ansible_host: 10.1.1.3
      ip: 10.1.1.3
      access_ip: 10.1.1.3
    k8s-worker-1:
      ansible_host: 10.1.2.4
      ip: 10.1.2.4
      access_ip: 10.1.2.4
    k8s-worker-2:
      ansible_host: 10.1.2.3
      ip: 10.1.2.3
      access_ip: 10.1.2.3
  children:
    kube_control_plane:
      hosts:
        k8s-master-1:
    kube_node:
      hosts:
        k8s-master-1:
        k8s-worker-1:
        k8s-worker-2:
    etcd:
      hosts:
        k8s-master-1:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
    calico_rr:
      hosts: {}
  vars:
    ansible_user: provisioning
    ansible_ssh_private_key_file: ~/.ssh/provisioning_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/provisioning_key provisioning@35.246.200.13"'
    ansible_python_interpreter: /usr/bin/python3